# ============================================================
# TEVULY · Cloudflare Worker — FREE-tier bootstrap configuration
# No runtime Durable Objects, no runtime Queues. Async work runs
# through the D1 `jobs` table, polled by the pickup cron.
# Deploy with:  wrangler deploy --config wrangler.free.toml
# ============================================================

name                 = "tevuly-edge"
main                 = "src/index.ts"
compatibility_date   = "2024-12-01"
compatibility_flags  = ["nodejs_compat"]
workers_dev          = true

[observability]
enabled = true

[vars]
APP_ENV         = "development"
PUBLIC_BASE_URL = "https://tevuly.com"
CORS_ORIGINS    = "https://tevuly.com,https://www.tevuly.com"

[assets]
directory                = "../dist"
binding                  = "ASSETS"
not_found_handling       = "single-page-application"

# ---------- D1 ----------
[[d1_databases]]
binding        = "TEVULY_D1"
database_name  = "tevuly-d1"
database_id    = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

# ---------- R2 ----------
[[r2_buckets]]
binding     = "TEVULY_MEDIA"
bucket_name = "tevuly-media"

# ---------- Cron: job pickup + cart expiry ----------
[triggers]
crons = ["*/5 * * * *"]